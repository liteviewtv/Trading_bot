name: Paper Trading Cycle

on:
  workflow_dispatch:

concurrency:
  group: paper-trading-cycle
  cancel-in-progress: false

jobs:
  paper-cycle:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run MT5 demo trading bot with Telegram
        shell: pwsh
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_TERMINAL_PATH: ${{ secrets.MT5_TERMINAL_PATH }}
          MT5_ALLOW_LIVE: 'false'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_MAX_CYCLES: '0'
          TELEGRAM_POLL_INTERVAL_SECONDS: '10'
        run: python bot.py
